<a class='back' href='index.html'>&larr; overview</a>
<h1>File search</h1>
<p class='lead'>Search across all archived files. Data loaded from transfer logs.</p>

<div style="display:flex;gap:8px;align-items:center;margin-bottom:12px">
  <input class='search' id='q' placeholder='search filenames or paths...'
         style='max-width:500px;margin-bottom:0;font-size:15px;padding:10px 14px'>
  <span id='status' style='font-size:12px;color:#A3A3A3'></span>
</div>

<div id='info' style='font-size:12px;color:#7A7A7A;margin-bottom:14px'></div>

<table id='results' style='display:none'>
<thead><tr>
  <th>Drive</th><th>File</th><th>Path</th>
</tr></thead>
<tbody id='tbody'></tbody>
</table>

<div id='noresults' style='display:none;padding:24px;text-align:center;color:#7A7A7A;font-size:14px'>
  No matches found.
</div>

<script>
(function(){
  var allFiles = [];
  var loaded = 0;
  var totalDrives = 0;
  var totalFiles = 0;
  var manifest = null;
  var searchTimer = null;
  var MAX_RESULTS = 500;

  var q = document.getElementById('q');
  var status = document.getElementById('status');
  var info = document.getElementById('info');
  var tbody = document.getElementById('tbody');
  var table = document.getElementById('results');
  var noresults = document.getElementById('noresults');

  function updateStatus(){
    if(loaded<totalDrives){
      status.textContent = 'Loading... '+loaded+'/'+totalDrives+' drives ('+allFiles.length.toLocaleString()+' files)';
    } else {
      status.textContent = allFiles.length.toLocaleString()+' files indexed';
    }
  }

  function doSearch(){
    var term = q.value.trim().toLowerCase();
    if(term.length < 2){
      table.style.display='none';
      noresults.style.display='none';
      info.textContent='Type at least 2 characters to search.';
      return;
    }

    var hits = [];
    var terms = term.split(/\s+/);
    for(var i=0;i<allFiles.length && hits.length<MAX_RESULTS;i++){
      var f = allFiles[i];
      var lower = f[1];
      var match = true;
      for(var t=0;t<terms.length;t++){
        if(lower.indexOf(terms[t])<0){ match=false; break; }
      }
      if(match) hits.push(f);
    }

    if(hits.length===0){
      table.style.display='none';
      noresults.style.display='block';
      info.textContent='';
      return;
    }

    noresults.style.display='none';
    table.style.display='';
    var showing = hits.length < MAX_RESULTS ? hits.length : MAX_RESULTS+'+';
    info.textContent = showing + ' results';

    var html = '';
    for(var i=0;i<hits.length;i++){
      var drive = hits[i][0];
      var path = hits[i][2];
      var parts = path.split(/[/\\]/);

      var fname = parts[parts.length-1];
      var dir = parts.slice(0,-1).join('/');
      html += '<tr><td><a href="drives/'+drive+'.html">'+drive+'</a></td>'
            + '<td style="font-weight:500">'+escHtml(fname)+'</td>'
            + '<td><code>'+escHtml(dir)+'</code></td></tr>';
    }
    tbody.innerHTML = html;
  }

  function escHtml(s){
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  q.addEventListener('input', function(){
    clearTimeout(searchTimer);
    searchTimer = setTimeout(doSearch, 200);
  });

  fetch('data/manifest.json').then(function(r){return r.json()}).then(function(m){
    manifest = m;
    totalFiles = m.total_files;
    var drives = Object.keys(m.drives).sort();
    totalDrives = drives.length;
    updateStatus();

    function loadNext(idx){
      if(idx >= drives.length) return;
      var label = drives[idx];
      var chunk = m.drives[label].chunk;
      fetch('data/'+chunk).then(function(r){return r.json()}).then(function(data){
        for(var i=0;i<data.files.length;i++){
          var p = data.files[i];
          allFiles.push([label, p.toLowerCase(), p]);
        }
        loaded++;
        updateStatus();
        if(q.value.trim().length >= 2) doSearch();
        loadNext(idx+1);
      });
    }
    loadNext(0);
  });
})();
</script>
